[project]
name = "youtube-kit"
version = "0.5.0"
description = "YouTube CLI (ytk) and MCP server, built for agents and humans: analytics, uploads, comments and playlists across your channels."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Eugene Kosharnyi", email = "eugene.kosharnyi@gmail.com" }]
keywords = ["youtube", "youtube-cli", "youtube-mcp", "mcp", "cli", "agents", "claude", "codex", "youtube-analytics", "youtube-data-api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "cyclopts>=4.22,<5",
    "fastmcp>=4.1,<5",
    "google-api-python-client>=2.199.0",
    "google-auth>=2.56",
    "google-auth-oauthlib>=1.4.0",
    "httplib2>=0.22",
    "platformdirs>=4.11",
    "pydantic>=2.13,<3",
    "rich>=14",
]

[project.urls]
Homepage = "https://github.com/eukosh/youtube-kit"
Documentation = "https://github.com/eukosh/youtube-kit#readme"
Issues = "https://github.com/eukosh/youtube-kit/issues"
Changelog = "https://github.com/eukosh/youtube-kit/blob/main/CHANGELOG.md"

[project.scripts]
ytk = "youtube_kit.cli:main"

[build-system]
requires = ["uv_build>=0.9.5,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
extend-select = ["I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["live: hits the real YouTube API (needs LIVE_YOUTUBE_API_KEY)"]
