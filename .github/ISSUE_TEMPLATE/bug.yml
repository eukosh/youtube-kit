name: Bug report
description: Something doesn't work as documented.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `ytk --version`.
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and Python version
      placeholder: macOS 26, Python 3.13
  - type: textarea
    id: command
    attributes:
      label: Command
      description: The exact command you ran, or the MCP tool and its arguments.
      render: shell
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Output
      description: The JSON error from stderr and the exit code (`echo $?`). Remove any personal data.
      render: json
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
